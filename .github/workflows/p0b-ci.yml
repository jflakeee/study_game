name: P0-B branch tests
on:
  push:
    branches: [feat/p0b-learning-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Chromium browser smoke test
        timeout-minutes: 3
        run: npm run test:browser
      - name: Upload isolated P0-B preview build
        uses: actions/upload-artifact@v4
        with:
          name: p0b-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
