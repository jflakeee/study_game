name: P0-B branch tests
on:
  push:
    branches: [feat/p0b-learning-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Build isolated root-path preview and verify asset references
        run: |
          npm run build:preview
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const html=readFileSync('dist/index.html','utf8'); assert.match(html,/src=\\\"\\/assets\\//); assert.match(html,/href=\\\"\\/assets\\//); assert.doesNotMatch(html,/\\/study_game\\/assets\\//); console.log('PASS root preview asset references');"
      - name: Upload root-path preview build (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: p0b-root-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Chromium browser smoke test
        timeout-minutes: 3
        run: npm run test:browser
      - name: Upload Chromium viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0b-browser-screenshots
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload isolated P0-B preview build
        uses: actions/upload-artifact@v4
        with:
          name: p0b-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
