name: Verify studio tooling branch
on:
  push:
    branches:
      - chore/studio-tooling-20261119
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print revision and environment
        run: |
          echo "Commit: $GITHUB_SHA"
          node --version
          npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Root preview browser smoke
        run: |
          npm run build:preview
          node tests/root-preview-smoke.mjs
      - name: Record verification outcome
        if: always()
        run: |
          echo '## Study Game branch verification' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job status: \`$JOB_STATUS\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Scope: TypeScript build, unit tests, Chromium browser smoke, root preview smoke' >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
